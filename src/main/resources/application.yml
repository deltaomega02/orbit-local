spring:
  application:
    name: orbit-local
  datasource:
    # url 을 여기에 적지 않는다. OrbitEnvironmentPostProcessor 가 OS 별 데이터 경로
    # 아래의 H2 **파일** 경로를 넣어 준다. 여기에 값을 박으면 yml 이 우선순위에서
    # 이겨 버려서, 파일 모드 코드가 있어도 실제로는 계속 인메모리로 돌고
    # 껐다 켤 때마다 옷장이 통째로 사라진다. (테스트는 test/application.yml 이
    # 자기 url 을 따로 주므로 인메모리 그대로다)
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false          # 뷰에서 지연 로딩이 열리지 않게 한다 (N+1 은폐 방지)
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # 크기로 거절하지 않는다. -1 은 "제한 없음"이다.
      #
      # 8MB → 40MB 로 두 번 올렸는데, 올릴 때마다 그 선을 넘는 사진이 또 나왔다.
      # 숫자를 고르는 일 자체가 틀린 문제였다. 사용자가 자기 사진의 MB 를 알고
      # 있을 리 없고, 알아도 줄이는 방법을 모른다. 큰 사진은 거절할 것이 아니라
      # 서버가 받아서 줄이면 되는 것이었다(ImageNormalizer: 긴 변 1600px).
      #
      # 픽셀이 아무리 많아도 메모리는 터지지 않는다. 디코드할 때 원본을 통째로
      # 펼치지 않고 건너뛰며 읽기 때문이다(ImageNormalizer.decodeBounded).
      max-file-size: -1
      max-request-size: -1

# 인증. 시크릿은 반드시 환경변수(ORBIT_JWT_SECRET)로 주입한다.
# 아래 기본값은 "이건 개발용이다"라고 이름으로 못박아 둔 값이라, 운영에 그대로
# 올라가면 값만 봐도 사고인 걸 알 수 있다. 실제 시크릿은 저장소에 넣지 않는다.
orbit:
  # 이 앱을 쓰는 한 사람. 로그인 화면 대신 서버가 이 사람의 세션을 자동으로 연다
  # (POST /api/auth/session → OwnerAccountService).
  owner:
    display-name: "ユーザー"          # 화면에 보이는 이름. 여기 한 줄만 고치면 바뀐다
    email: "owner@orbit.local"      # 내부 식별자(계정 유니크 키). 화면에 노출하지 않는다
    # 이 이메일은 **계정을 새로 만들 때 쓰는 값**이지, 기존 계정을 찾는 열쇠가 아니다.
    # 이미 데이터가 있는 DB 에서 기동하면 이메일이 달라도 그 계정을 이어받는다.
    # 근거는 OwnerAccountService 주석에 적어 뒀다 — 이메일 일치만 보면 기존 옷장을
    # 두고 빈 계정을 새로 만들어 버린다.

  jwt:
    secret: ${ORBIT_JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-0123456789}
    access-token-validity: 15m     # 짧게. 무상태 검증이라 탈퇴/차단 반영 지연의 상한이 된다
    # 365일. 로그아웃 버튼이 없는 개인용 로컬 앱이라, 짧은 만료는 공격자가 아니라
    # 사용자만 끊는다(회전도 폐기 저장소도 없어 훔친 쪽은 만료까지 그냥 쓴다).
    # 대가는 탈취 시 노출 기간이 최대 1년이라는 것. 판단의 전체 근거는
    # JwtProperties.refreshTokenValidity 주석과 README 에 적어 뒀다.
    refresh-token-validity: 365d

  media:
    # dir 을 여기에 적지 않는다. OrbitEnvironmentPostProcessor 가 OS 별 사용자
    # 데이터 폴더 아래 경로를 넣어 준다. 여기에 값을 박으면 yml 이 우선순위에서
    # 이겨서, DB·키는 사용자 폴더에 가는데 **사진만 실행 디렉터리 밑**에 쌓인다.
    # 설치형 앱에서는 앱을 지우거나 옮기는 순간 사진이 통째로 사라지는 배치다.
    # (datasource.url 도 같은 이유로 여기에 두지 않는다)
    # 개발 중 다른 곳에 쌓고 싶으면 ORBIT_MEDIA_DIR 환경변수를 쓴다.
    #
    # 크기 상한은 없앴다. 디스크는 상한이 아니라 **저장 직전 축소**로 지킨다
    # (ImageNormalizer: 긴 변 1600px, JPEG 85, EXIF 회전 적용 후 메타데이터 폐기).
    # 몇 MB 로 들어오든 저장되는 것은 어차피 수백 KB 다.

  gemini:
    # 키는 환경변수로만 들어온다. 기본값이 빈 문자열이므로 이 파일에 실제 키가 존재할
    # 일이 없고, 키가 없으면 AI 엔드포인트만 503 이고 나머지 기능은 그대로 동작한다.
    api-key: ${GEMINI_API_KEY:}
    enabled: true
    base-url: https://generativelanguage.googleapis.com/v1beta
    # 모델 id 는 설정으로 뺀다. 하드코딩하면 모델이 바뀔 때마다 배포가 필요하다.
    # 2026-08 기준 GA 모델로 확인해 넣었다(텍스트: Gemini 3.6 Flash,
    # 이미지: Gemini 3.1 Flash Image = Nano Banana 2). 모델 라인업은 자주 바뀌므로
    # 401/404 가 나면 여기부터 확인할 것.
    text-model: gemini-3.6-flash
    # 이미지도 Flash 다. 한때 여기가 3-pro-image 였고, 그때 근거는 "Flash 가 얼굴을
    # 다시 그린다"였다. 그 비교는 **긴 프롬프트로 한 것**이라 결론이 뒤집혔다.
    #
    # 프롬프트를 검증된 262자로 줄이고 같은 사진으로 다시 재면:
    #   Flash — 656x1602. 입력(655x1600)과 같은 프레임. 배경·자세·손 위치·표정이
    #           그대로 남고 옷만 바뀐다. 3회 연속 동일.
    #   Pro   — 1152x922. 매번 가로로 새로 그린다. 전신이 상반신이 되고 머리 모양과
    #           촬영 각도가 바뀐다. 5회 연속 동일. 얼굴이 닮았을 뿐 같은 사진이 아니다.
    # 이 기능의 값어치는 "내 사진에서 옷만 바뀐 것"이므로 Flash 가 맞다.
    #
    # 대신 Flash 는 옷 사진에 옷이 여러 벌 찍혀 있으면 엉뚱한 것을 고른다(청바지 세
    # 벌이 찍힌 사진에서 검정 대신 연청을 입혔다). 이건 모델이 아니라 등록 사진의
    # 문제이므로, 옷은 한 벌만 찍어 올리는 것으로 푼다.
    image-model: gemini-3.1-flash-image
    connect-timeout: 5s
    read-timeout: 60s              # 이미지 생성은 원래 느리다
    max-attempts: 3                # 재시도 대상은 타임아웃·5xx·429 뿐 (4xx 는 즉시 포기)
    retry-backoff: 500ms

server:
  port: 8080
  # 루프백에만 바인딩한다. **이 한 줄이 자동 세션(POST /api/auth/session)의 안전
  # 장치다.** 그 엔드포인트는 자격증명 없이 주인의 토큰을 내주므로, 서버에 닿을 수
  # 있는 범위가 곧 옷장에 닿을 수 있는 범위가 된다. 0.0.0.0 으로 열려 있으면 같은
  # 카페 와이파이의 아무나 옷 사진과 코디 기록을 읽고 지울 수 있다.
  # 막지 못하는 것: **같은 기기의 다른 프로세스**. 루프백은 기기 밖을 막을 뿐이다.
  # 그 대가를 받아들이는 근거는 AuthService.startOwnerSession 주석과 README 에 있다.
  # 여러 사람이 쓰게 되는 날에는 이 값을 풀기 **전에** 로그인을 먼저 되살려야 한다.
  address: 127.0.0.1

---
# 로컬 데스크톱 앱으로 붙일 때 쓰는 MySQL 프로파일
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/orbit?serverTimezone=Asia/Seoul&characterEncoding=utf8mb4
    username: ${DB_USER:orbit}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
