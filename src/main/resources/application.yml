spring:
  application:
    name: orbit-local
  datasource:
    # url 은 OrbitEnvironmentPostProcessor 가 OS 별 H2 파일 경로로 넣는다.
    # 여기에 적으면 yml 이 우선해 인메모리로 돌고 재시작마다 데이터가 사라진다.
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false          # 뷰에서 지연 로딩이 열리지 않게 한다 (N+1 은폐 방지)
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # 크기 제한 없음(-1). 큰 사진은 ImageNormalizer 가 긴 변 1600px 로 줄여 저장하고,
      # 디코드도 샘플링으로 읽어 메모리를 넘기지 않는다(decodeBounded).
      max-file-size: -1
      max-request-size: -1

# 시크릿은 ORBIT_JWT_SECRET 환경변수로 주입한다. 기본값은 개발 전용.
orbit:
  # 단일 사용자. 로그인 대신 POST /api/auth/session 이 세션을 연다(OwnerAccountService).
  owner:
    display-name: "ユーザー"          # 화면 표시 이름
    email: "owner@orbit.local"      # 내부 식별자(계정 유니크 키). 화면에 노출하지 않는다
    # 계정 생성 시에만 쓴다. 기존 DB 에서는 이메일이 달라도 그 계정을 이어받는다.

  jwt:
    secret: ${ORBIT_JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-0123456789}
    access-token-validity: 15m     # 짧게. 무상태 검증이라 탈퇴/차단 반영 지연의 상한이 된다
    # 로그아웃이 없는 개인용 로컬 앱이라 365일. 탈취 시 노출 기간이 최대 1년이다
    # (JwtProperties.refreshTokenValidity 주석 참고).
    refresh-token-validity: 365d

  media:
    # dir 은 OrbitEnvironmentPostProcessor 가 OS 별 사용자 데이터 폴더로 넣는다. 여기에 적으면
    # yml 이 우선해 사진만 실행 디렉터리에 쌓인다. 다른 경로는 ORBIT_MEDIA_DIR 환경변수로.
    # 크기 상한 없이 저장 직전에 축소한다(ImageNormalizer: 긴 변 1600px, JPEG 85, 메타데이터 제거).

  gemini:
    # 키는 환경변수로만 받는다. 없으면 AI 엔드포인트만 503 을 반환한다.
    api-key: ${GEMINI_API_KEY:}
    enabled: true
    base-url: https://generativelanguage.googleapis.com/v1beta
    # 2026-08 기준 GA 모델. 401/404 가 나면 모델 id 부터 확인할 것.
    text-model: gemini-3.6-flash
    # Pro 는 구도를 새로 그리고, Flash 는 원본 프레임을 유지한 채 옷만 바꿔서 Flash 를 쓴다.
    # 옷 사진에 여러 벌이 찍혀 있으면 엉뚱한 옷을 고르므로 한 벌씩 찍어야 한다.
    image-model: gemini-3.1-flash-image
    connect-timeout: 5s
    read-timeout: 60s              # 이미지 생성은 원래 느리다
    max-attempts: 3                # 재시도 대상은 타임아웃·5xx·429 뿐 (4xx 는 즉시 포기)
    retry-backoff: 500ms

server:
  port: 8080
  # 루프백 전용. 자격증명 없이 토큰을 내주는 POST /api/auth/session 의 안전장치다.
  # 같은 기기의 다른 프로세스는 막지 못한다. 외부에 열기 전에 로그인을 먼저 되살릴 것.
  address: 127.0.0.1

---
# 로컬 데스크톱 앱으로 붙일 때 쓰는 MySQL 프로파일
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/orbit?serverTimezone=Asia/Seoul&characterEncoding=utf8mb4
    username: ${DB_USER:orbit}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
