spring:
  application:
    name: orbit-local
  datasource:
    url: jdbc:h2:mem:orbit;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false          # 뷰에서 지연 로딩이 열리지 않게 한다 (N+1 은폐 방지)
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

---
# 로컬 데스크톱 앱으로 붙일 때 쓰는 MySQL 프로파일
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/orbit?serverTimezone=Asia/Seoul&characterEncoding=utf8mb4
    username: ${DB_USER:orbit}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
