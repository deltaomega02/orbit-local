spring:
  datasource:
    url: jdbc:h2:mem:orbit_test;DB_CLOSE_DELAY=-1;MODE=MySQL
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true   # N+1 검증 테스트에서 쿼리 수를 센다
logging:
  level:
    org.hibernate.stat: WARN

orbit:
  # 일부러 코드 기본값(エリ / eri@orbit.local)과 다른 값을 준다. 같은 값이면
  # "설정을 읽어서 쓴 것"과 "코드에 박힌 값이 우연히 맞은 것"을 테스트가 구별하지
  # 못한다. OwnerSessionTest 가 이 값이 화면(/api/users/me)까지 나오는지 본다.
  owner:
    display-name: "テスト主"
    email: "owner@orbit.test"

  jwt:
    # 테스트 전용 값. main 의 application.yml 은 테스트 클래스패스에서 이 파일로
    # 완전히 대체되므로(병합이 아니다) 여기에도 있어야 한다.
    secret: test-only-secret-key-for-orbit-local-tests-0123456789
    access-token-validity: 15m
    # 운영 설정과 같은 값으로 맞춘다. 테스트에서만 짧게 두면 "만료가 실제로
    # 몇 일인가"를 검증하는 테스트가 진실을 보지 못한다.
    refresh-token-validity: 365d

  media:
    # build/ 아래라 clean 하면 같이 사라진다. 테스트가 사용자 데이터 디렉토리를 건드리지 않는다.
    dir: ./build/test-media
    # 일부러 작게 잡는다. 상한이 실제로 동작하는지 확인하려면 상한을 넘겨봐야 하는데,
    # 40MB 짜리 바이트 배열을 만드는 테스트는 느리고 메모리를 낭비한다.
    #
    # 64KB → 2MB. 축소 동작을 검증하려면 **줄일 만한 사진**을 실제로 올려봐야 하는데
    # (4000×3000), 그 JPEG 이 64KB 를 넘길지는 인코더 사정이라 테스트가 축소가 아니라
    # 크기 때문에 413 을 맞을 수 있다. 그러면 이 테스트는 자기가 무엇을 검증하는지
    # 모르게 된다. 2MB 면 그 불확실성이 사라지고, 상한 초과 검증에도 여전히 충분히 작다.
    #
    # 운영 상한(40MB)이 실제로 그 값인지는 이 파일이 증명하지 못한다 —
    # MediaProperties 의 기본값을 직접 보는 테스트로 따로 못박아 뒀다.
    max-file-size: 2MB

  gemini:
    # 핵심. 이 값이 false 라서 테스트 컨텍스트에는 Gemini 어댑터 빈이 아예 만들어지지
    # 않는다. AI 테스트는 FakeAiConfig 의 결정적 가짜를 직접 등록해서 쓴다.
    # 즉 테스트가 실수로 실제 API 를 부를 방법이 구조적으로 없다.
    enabled: false
